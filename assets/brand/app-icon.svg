<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Meteo San Martino app icon: the sun rising behind the San Martino ridge.
       Full-bleed artwork; keep key shapes inside the central 80% (maskable safe zone). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82e8"/>
      <stop offset="0.55" stop-color="#1d4ea6"/>
      <stop offset="1" stop-color="#0b1c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="610" cy="470" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffb347" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffcc47"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="336" x2="0" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6fa"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b7fd6"/>
      <stop offset="1" stop-color="#2a56a6"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14306a"/>
      <stop offset="1" stop-color="#091634"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06122e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="610" cy="470" r="360" fill="url(#glow)"/>

  <!-- Sun -->
  <circle cx="610" cy="470" r="168" fill="url(#sun)"/>

  <!-- Far ridge -->
  <path d="M0 690 L150 600 L265 650 L420 540 L560 640 L700 575 L835 640 L1024 560 V1024 H0 Z" fill="url(#far)"/>

  <!-- Cloud drifting in front of the sun -->
  <g filter="url(#soft)" fill="url(#cloud)">
    <rect x="292" y="500" width="380" height="112" rx="56"/>
    <circle cx="388" cy="500" r="80"/>
    <circle cx="502" cy="448" r="112"/>
    <circle cx="610" cy="512" r="72"/>
  </g>

  <!-- Near ridge with the abbey hill -->
  <path d="M0 790 C120 735 230 715 330 750 C410 778 470 730 545 700 C620 672 700 712 780 748 C870 790 950 760 1024 730 V1024 H0 Z" fill="url(#near)"/>
</svg>
